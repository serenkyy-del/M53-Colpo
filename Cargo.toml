[workspace]
members = ["crates/domain", "crates/contracts", "crates/client", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
m53-domain = { path = "crates/domain" }
m53-contracts = { path = "crates/contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.25.0", features = ["serde", "v4"] }
axum = "=0.7.9"
tokio = { version = "=1.52.3", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
sha2 = "=0.10.9"
schemars = { version = "=0.8.22", features = ["uuid1"] }
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
strip = "debuginfo"
