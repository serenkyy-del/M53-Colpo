name: Desktop and server release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  COLPOSCOPY_SOURCE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build and package Windows x64
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo metadata --manifest-path prototypes/gpui-editor/Cargo.toml --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc --features standalone | Set-Content -Encoding utf8 metadata.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python public/release/collect_notices.py metadata.json WindowsNotices
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & public/windows/package.ps1 -RustLicensesDirectory WindowsNotices -OutputDirectory release
      - name: Install the Windows package and verify its window
        shell: pwsh
        run: |
          try { & public/windows/test-setup.ps1 -Archive release/Colposcopy-Windows-x64.zip }
          catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Output "::error title=Windows installer::$message"
            throw
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: release/Colposcopy-Windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build Linux desktop x64
        run: |
          docker build -t colposcopy-linux-builder:bookworm public/linux
          mkdir -p build-linux/{cargo,target} release
          version="${GITHUB_REF_NAME#v}"
          version="${version/-preview./~preview.}"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/build/cargo -e CARGO_TARGET_DIR=/build/target -e "PACKAGE_VERSION=$version" -e COLPOSCOPY_SOURCE_URL \
            -v "$PWD:/src:ro" -v "$PWD/build-linux:/build" -v "$PWD/release:/out" -w /src \
            colposcopy-linux-builder:bookworm sh -ec '
            cargo metadata --manifest-path prototypes/gpui-editor/Cargo.toml --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --features standalone > /build/metadata.json
            python3 public/release/collect_notices.py /build/metadata.json /build/notices
            cargo test --locked -p m53-client --no-default-features --features standalone --test diagnoses_report --test standalone_linux_storage
            cargo build --manifest-path prototypes/gpui-editor/Cargo.toml --locked --profile distribution --features standalone --bin m53-gpui-editor
            python3 public/linux/package.py --binary /build/target/distribution/m53-gpui-editor --version "$PACKAGE_VERSION" --notices /build/notices --output /out
            '
      - name: Package the server and corresponding sources
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > build-linux/server-metadata.json
          python3 public/release/collect_notices.py build-linux/server-metadata.json release/ServerNotices
          docker build -t colposcopy-public:local -f public/deploy/Dockerfile .
          bash public/deploy/package-server.sh release
          git archive --format=zip --output=release/Colposcopy-Source.zip HEAD
          python3 public/release/dependency_sources.py release/Colposcopy-DependencySources.tar.gz --cache build-linux/cargo/registry/cache
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-and-source
          path: |
            release/Colposcopy-Linux-x64.deb
            release/Colposcopy-Server-Linux-x64.tar.gz
            release/Colposcopy-Source.zip
            release/Colposcopy-DependencySources.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release
          merge-multiple: true
      - name: Publish installable preview packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 public/release/verify_release.py release --release-url "$COLPOSCOPY_SOURCE_URL"
          python3 public/release/license_bundle.py release --release-url "$COLPOSCOPY_SOURCE_URL" --output release/Colposcopy-License-Notices.zip
          (cd release && sha256sum Colposcopy-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --draft \
            --title "M53-Colpo $GITHUB_REF_NAME" --notes-file public/release/NOTES.md release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
