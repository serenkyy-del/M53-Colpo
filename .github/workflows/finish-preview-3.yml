name: Publish audited preview.3 artifacts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-preview-3.yml']

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '44987117703'
      TAG: v0.1.0-preview.3
      RELEASE_SHA: 44c12ca6b6728ef1ade8299292ee9be79a39224e
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify and publish the exact tagged build
        run: |
          set -euo pipefail
          run="/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh api "$run" | jq -e --arg sha "$RELEASE_SHA" --arg tag "$TAG" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == $tag and .event == "push" and .head_repository.full_name == $repo
          ' >/dev/null
          ready=false
          for attempt in $(seq 1 65); do
            jobs=$(gh api "$run/jobs")
            if jq -e '[.jobs[] | select(.name=="windows" or .name=="linux" ) | select(.conclusion=="success")] | length==2' <<< "$jobs" >/dev/null; then
              ready=true
              break
            fi
            if jq -e '[.jobs[] | select(.name=="windows" or .name=="linux" ) | select(.status=="completed" and .conclusion!="success")] | length>0' <<< "$jobs" >/dev/null; then
              echo 'The tagged platform build did not pass'
              exit 1
            fi
            sleep 20
          done
          test "$ready" = true
          gh run download "$RUN_ID" --name linux-and-source --dir distribution
          gh run download "$RUN_ID" --name windows --dir distribution
          python3 public/release/verify_release.py distribution --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          (cd distribution && sha256sum Colposcopy-* > SHA256SUMS)
          unzip -p distribution/Colposcopy-Source.zip public/release/NOTES.md > /tmp/colposcopy-release-notes.md
          if gh release view "$TAG" --json isDraft --jq 'select(.isDraft == false) | .isDraft' | grep -qx false; then
            echo 'Release is already public'
            exit 0
          fi
          gh release create "$TAG" --verify-tag --prerelease --draft \
            --title "M53-Colpo $TAG" --notes-file /tmp/colposcopy-release-notes.md distribution/*
          gh release edit "$TAG" --draft=false
