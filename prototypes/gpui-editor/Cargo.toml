[package]
name = "m53-gpui-editor"
default-run = "m53-gpui-editor"
version = "0.1.0"
edition = "2024"
publish = false

# Isolated dependency graph while the Windows vertical slice is evaluated.
[workspace]

[features]
default = ["standalone"]
standalone = ["m53-client/standalone"]
activate-https = ["m53-client/activate-https"]

[dependencies]
gpui-kit = { version = "=0.7.3" }
m53-client = { path = "../../crates/client", default-features = false, features = ["dev-http"] }
m53-domain = { path = "../../crates/domain" }
m53-contracts = { path = "../../crates/contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.25.0", features = ["v4", "serde"] }
image = "0.25"
anyhow = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rust-i18n = "=4.2.4"
# Embed icon bytes even in cross-compiled development builds.
rust-embed = { version = "8.13", features = ["debug-embed"] }

[dev-dependencies]
# Synthetic portable-print image fixture; identical to the client dependency.
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
rfd = "=0.15.3"

[target.'cfg(not(windows))'.dependencies]
# Native offscreen verification is a development capability, not a Windows runtime dependency.
gpui-kit = { version = "=0.7.3", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.m53-client]
opt-level = 2
[profile.dev.package.m53-gpui-editor]
opt-level = 2

[profile.distribution]
inherits = 'release'
opt-level = 3
codegen-units = 16
lto = false
debug = 0
strip = 'debuginfo'
