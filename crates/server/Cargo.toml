[package]
name = "m53-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
m53-domain.workspace = true
m53-contracts.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"

base64 = "=0.22.1"
ring = "=0.17.14"
quick-xml = "=0.41.0"

tokio-stream = "=0.1.19"

image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }

axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }

[features]
default = ["standalone"]
standalone = []
