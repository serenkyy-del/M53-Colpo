[package]
name = "m53-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
standalone = ["reqwest/rustls-tls-native-roots"]
default = ["standalone"]
legacy-ui = ["dep:egui", "dep:eframe", "dep:rfd", "dep:raw-window-handle", "dep:wry", "dep:tao"]
dev-http = []
activate-https = []

[dependencies]
egui = { version = "=0.31.1", optional = true }
ab_glyph = "=0.2.32"
m53-domain.workspace = true
m53-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest.workspace = true
tokio = { version = ">=1.52.3, <1.54", features = ["rt", "time"] }
sha2.workspace = true
hex.workspace = true
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }
printpdf = { version = "=0.7.0", features = ["embedded_images"] }
base64 = "=0.22.1"
kamadak-exif = "=0.6.1"
tiff = "=0.9.1"
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_System_WinRT", "Devices_Bluetooth", "Devices_Enumeration", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
raw-window-handle = { version = "=0.6.2", optional = true }
wry = { optional = true, version = "=0.57.0", default-features = false, features = ["os-webview"] }
tao = { optional = true, version = "=0.37.0", default-features = false, features = ["rwh_06"] }
eframe = { optional = true, version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "=0.15.3", optional = true }
windows-sys = { version = "=0.59.0", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs"] }

[[test]]
name = "editor_ui"
required-features = ["legacy-ui"]
